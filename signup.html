<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp - ClassIQ</title>
  <meta name="description" content="Online courses, interactive learning tools, all-in-one solution, flexible learning, interactive community">
  <meta name="keywords" content="ClassIQ, ClassIQ app, ClassIQ Business, ClassIQ Business app, ClassIQ Business app download, ClassIQ Business app download for android, ClassIQ Business app download for ios, ClassIQ Business app download for pc, ClassIQ Business app download for windows, ClassIQ Business app download for mac, ClassIQ Business app download for linux, Teach on ClassIQ, teaching tools, online learning, interactive learning, flexible learning, interactive community, online courses, online classes, online education, online learning platform, online learning app, online learning software, online learning tools, online learning resources, online learning management system, online learning management software">
  <meta name="author" content="ClassIQ Business">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- Header -->
<header class="site-header">
  <div class="container nav">
    <div class="nav-left">
     <a href="index.html" class="brand">
        <span class="brand-icon">
            <img src="assets/logo-CSs2XfzI.png" alt="ClassIQ - Empower Your Learning Journey" data-fallback>
          </span>
      </a>
      <a href="index.html#courses" class="nav-link">Cources</a>
    </div>
    <div class="nav-right">
      <a href="login.html" class="btn btn-dark">Login</a>
      <a href="signup.html" class="btn btn-dark">SignUp</a>
    </div>
  </div>
</header>
<!-- Header End -->

<main class="auth-wrap">
  <form class="auth-card" id="signupForm" novalidate>
    <h1>SignUp</h1>
<!-- Email -->

    <div class="field">
      <input type="email" id="email" name="email" placeholder="Enter Your Email" autocomplete="email">
      <span class="err" id="emailErr"></span>
    </div>
<!-- Email End -->
<!-- Fullname -->
    <div class="field">
      <input type="text" id="fullname" name="fullname" placeholder="Enter Your Fullname" autocomplete="name">
      <span class="err" id="fullnameErr"></span>
    </div>
<!-- Fullname End -->
<!-- Password -->

    <div class="field">
      <div class="pw-wrap">
        <input type="password" id="password" name="password" placeholder="Enter Your Password" autocomplete="new-password">
        <button type="button" class="pw-toggle" data-toggle="password">Show</button>
      </div>
      <span class="err" id="passwordErr"></span>
    </div>
<!-- Password End -->

    <button type="submit" class="btn btn-lime submit">SignUp</button>
    <div class="form-msg" id="formMsg" role="status"></div>

    <p class="switch">Already have an account? <a href="login.html">Login</a></p>
  </form>
</main>

<div class="toast" id="toast"></div>
<script src="js/signup.js"></script>
</body>
</html>
